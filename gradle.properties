# ====================================================================
# Kairos BUILD CONFIGURATION
# Optimized for large codebase (140k+ lines)
# ====================================================================

# --------------------------------------------------------------------
# MEMORY SETTINGS (balanced for local machines and GitHub-hosted runners)
# --------------------------------------------------------------------

# Gradle and the in-process Kotlin compiler share one bounded heap.
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Avoid a second multi-gigabyte JVM on 7 GB CI runners.
kotlin.compiler.execution.strategy=in-process

# --------------------------------------------------------------------
# GRADLE DAEMON & PERFORMANCE (CRITICAL - DAEMON MUST BE ENABLED)
# --------------------------------------------------------------------

# Enable daemon - THIS MUST BE TRUE
org.gradle.daemon=true

# This is a single-module app; parallel task execution increases peak memory.
org.gradle.parallel=false

# Build caching - reuses outputs from previous builds
org.gradle.caching=true

# Configuration cache is disabled until every Android/KSP task is verified cache-safe
org.gradle.configuration-cache=false

# File system watching - faster incremental builds
org.gradle.vfs.watch=true

# Keep KSP, Kotlin, lint, and dexing inside a predictable memory envelope.
org.gradle.workers.max=2

# --------------------------------------------------------------------
# KOTLIN COMPILER SETTINGS
# --------------------------------------------------------------------

# Incremental compilation - only recompile changed files
kotlin.incremental=true
kotlin.incremental.java=true

# Kotlin build caching
kotlin.caching.enabled=true

# Kotlin code style
kotlin.code.style=official

# --------------------------------------------------------------------
# ANDROID BUILD SETTINGS
# --------------------------------------------------------------------

# AndroidX libraries
android.useAndroidX=true

# Non-transitive R classes (reduces memory and build time)
android.nonTransitiveRClass=true

# Enable R8 full mode for better optimization
android.enableR8.fullMode=true

# Jetpack Compose
android.defaults.buildfeatures.compose=true


# Disable unused build features (saves memory)
android.defaults.buildfeatures.aidl=false
android.defaults.buildfeatures.renderscript=false
android.defaults.buildfeatures.shaders=false
android.defaults.buildfeatures.resValues=true

# --------------------------------------------------------------------
# KSP (Kotlin Symbol Processing) - Used by Room and Hilt
# --------------------------------------------------------------------

# Enable incremental processing
ksp.incremental=true
ksp.incremental.log=false
